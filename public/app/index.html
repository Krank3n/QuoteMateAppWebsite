    <!-- SPA route restore: when a hard refresh of /app/<route> 404s, the
         marketing 404 page stashes the route and bounces here. Replace the URL
         back to the intended route before the JS bundle (deferred below) reads
         it, so React Navigation lands on the right screen. -->
